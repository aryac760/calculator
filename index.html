 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker - Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex justify-center">

  <div class="w-full max-w-md space-y-4">
    

    <div class="bg-white p-6 rounded-2xl shadow-lg">
      <h1 class="text-2xl font-bold mb-2"> Budget Tracker</h1>
      <h2 id="balance" class="text-3xl font-bold">₹0</h2>
      <div class="flex gap-4 mt-3 text-sm">
        <p class="bg-green-100 text-green-700 px-3 py-1 rounded-full">Income: <span id="income">₹0</span></p>
        <p class="bg-red-100 text-red-700 px-3 py-1 rounded-full">Expense: <span id="expense">₹0</span></p>
      </div>
      <p id="loading" class="text-gray-400 text-sm mt-2">Loading data...</p>
    </div>

    
    <div class="bg-white p-6 rounded-2xl shadow-lg space-y-3">
      <select id="type" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none">
        <option value="income">Income (+)</option>
        <option value="expense">Expense (-)</option>
      </select>
      <input id="amount" type="number" placeholder="Amount" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none">
      <input id="category" type="text" placeholder="Category (e.g. Food, Salary)" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none">
      <button id="addBtn" class="w-full bg-black text-white p-3 rounded-xl font-semibold hover:bg-gray-800 transition">Add Transaction</button>
    </div>


    <div class="bg-white p-6 rounded-2xl shadow-lg">
      <h3 class="font-bold mb-3">Transactions</h3>
      <div id="list" class="space-y-2"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
    
</body>
</html>
